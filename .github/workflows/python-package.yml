name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
          pip install pytest pytest-asyncio pytest-httpserver pytest-rerunfailures flake8 mypy pyyaml

      - name: Lint with flake8
        run: |
          flake8 perra --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Typecheck with mypy
        run: |
          mypy --check-untyped-defs --ignore-missing-imports --explicit-package-bases perra/updater.py scripts/setup_manager.py tests/test_updater.py tests/test_setup_manager.py

      - name: Test with pytest
        run: |
          pytest -m "not slow" tests
