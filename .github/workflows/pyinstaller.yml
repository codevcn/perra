name: Build Windows Installer

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.1.0"
  NIGHTLY_TAG: "nightly-v0.1.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[pdf]"
          pip install -r pyinstaller/requirements.txt

      - name: Build --onedir bundle and Inno Setup installer
        shell: pwsh
        run: |
          python scripts/setup_manager.py build-all --clean

      - name: Verify installer and checksums exist
        shell: pwsh
        run: |
          Get-ChildItem dist/installer
          Get-Content dist/installer/SHA256SUMS.txt

      - name: Move nightly tag to built commit
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force "${{ env.NIGHTLY_TAG }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ env.NIGHTLY_TAG }}"

      - name: Publish nightly Windows installer prerelease
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.NIGHTLY_TAG }}
          name: "Perra Nightly (${{ env.NIGHTLY_TAG }})"
          body: "Automated Windows `--onedir` + Inno Setup installer built from commit `${{ github.sha }}`."
          prerelease: true
          makeLatest: false
          allowUpdates: true
          artifacts: "dist/installer/PerraSetup-*.exe,dist/installer/SHA256SUMS.txt"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Windows installer to published release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          omitDraftDuringUpdate: true
          artifacts: "dist/installer/PerraSetup-*.exe,dist/installer/SHA256SUMS.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
